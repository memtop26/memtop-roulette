<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>СМЕХЛЫСТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#12081f;
  --bg2:#2d1b4e;
  --bg3:#1a0b2e;
  --accent:#8b3dff;
  --accent2:#4b69ff;
  --gold:#ffd700;
  --green:#2ecc71;
  --red:#e74c3c;
  --text:#ffffff;
  --muted:#b8a5d9;
  --card:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg3),var(--bg2),var(--bg1),var(--bg2),var(--bg3));
  background-size:400% 400%;
  animation:bgShift 18s ease infinite;
  min-height:100vh;
  overflow-x:hidden;
  user-select:none;
}
@keyframes bgShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.orbit{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.orbit span{
  position:absolute;
  bottom:-80px;
  opacity:.12;
  animation:floatUp linear infinite;
  filter:blur(.2px);
}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg) scale(.8);opacity:0}
  10%{opacity:.16}
  100%{transform:translateY(-120vh) rotate(360deg) scale(1.2);opacity:0}
}
.wrap{
  position:relative;
  z-index:2;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:18px 16px 110px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.brand{
  font-size:18px;
  font-weight:900;
  letter-spacing:.5px;
  background:linear-gradient(90deg,#fff,#ffd700,#8b3dff,#fff);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shineText 6s linear infinite;
}
@keyframes shineText{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}
}
.userchip{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
  border-radius:999px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
  backdrop-filter:blur(10px);
  max-width:58%;
}
.userchip .nick{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:120px;
}
.userchip .coins{color:var(--gold)}
.hero{
  position:relative;
  border-radius:28px;
  padding:26px 20px;
  text-align:center;
  background:linear-gradient(135deg,rgba(139,61,255,.22),rgba(75,105,255,.14),rgba(255,215,0,.08));
  border:1px solid rgba(139,61,255,.45);
  box-shadow:0 20px 60px rgba(139,61,255,.20), inset 0 0 40px rgba(255,255,255,.04);
  overflow:hidden;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translateY(0);box-shadow:0 20px 60px rgba(139,61,255,.18)}
  50%{transform:translateY(-3px);box-shadow:0 26px 70px rgba(139,61,255,.28)}
}
.hero::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.08),transparent 30%);
  animation:rotateGlow 8s linear infinite;
}
@keyframes rotateGlow{to{transform:rotate(360deg)}}
.hero-inner{position:relative;z-index:2}
.hero h1{
  font-size:32px;
  line-height:1.05;
  font-weight:950;
  margin-bottom:10px;
  text-shadow:0 8px 30px rgba(0,0,0,.35);
}
.hero p{
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}
.section{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:18px;
  backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(0,0,0,.18);
  animation:slideUp .45s ease both;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.section h2{
  font-size:16px;
  font-weight:900;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.hidden{display:none !important}
.create-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn{
  border:none;
  outline:none;
  color:#fff;
  font-weight:850;
  border-radius:18px;
  padding:14px 16px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease, opacity .2s ease;
  position:relative;
  overflow:hidden;
  font-size:14px;
}
.btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.18) 40%,transparent 60%);
  transform:translateX(-120%);
  transition:transform .6s ease;
}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{padding:18px 14px;font-size:15px;border-radius:20px}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px rgba(139,61,255,.30);
}
.btn.purple{
  background:linear-gradient(135deg,#b06bff,#7a2bff);
  box-shadow:0 12px 30px rgba(122,43,255,.25);
}
.btn.gold{
  background:linear-gradient(135deg,#ffd700,#ffb300);
  color:#1b1000;
  box-shadow:0 12px 30px rgba(255,215,0,.22);
}
.btn.green{
  background:linear-gradient(135deg,#2ecc71,#1abc9c);
  box-shadow:0 12px 30px rgba(46,204,113,.22);
}
.btn.danger{
  background:linear-gradient(135deg,#e74c3c,#c0392b);
  box-shadow:0 12px 30px rgba(231,76,60,.18);
}
.btn.ghost{
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
}
.join-row{
  display:flex;
  gap:10px;
}
.code-input{
  flex:1;
  min-width:0;
  background:rgba(0,0,0,.22);
  border:1px solid var(--border);
  color:#fff;
  border-radius:18px;
  padding:14px;
  font-size:22px;
  font-weight:900;
  letter-spacing:8px;
  text-align:center;
  text-transform:uppercase;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.code-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,215,0,.12);
}
.code-input::placeholder{
  color:#7a6a94;
  letter-spacing:4px;
  font-size:16px;
}
.lobbies{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.lobby{
  position:relative;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  animation:popIn .4s ease both;
  overflow:hidden;
}
@keyframes popIn{
  from{opacity:0;transform:scale(.94) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.lobby::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
  background:linear-gradient(180deg,var(--accent),var(--gold));
}
.lobby-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:20px;
  font-weight:950;
  letter-spacing:3px;
  color:var(--gold);
  text-shadow:0 0 18px rgba(255,215,0,.25);
}
.badge{
  font-size:11px;
  font-weight:850;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
  color:var(--muted);
  white-space:nowrap;
}
.badge.mem{color:#b06bff;border-color:rgba(176,107,255,.35)}
.badge.text{color:#7cc4ff;border-color:rgba(124,196,255,.25)}
.meta{
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
}
.players{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.player-pill{
  font-size:11px;
  font-weight:750;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  color:#e9dcff;
}
.player-pill.more{color:var(--muted)}
.lobby-actions{
  display:flex;
  justify-content:flex-end;
}
.my-card{
  background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(139,61,255,.14));
  border:1px solid rgba(255,215,0,.30);
  border-radius:22px;
  padding:16px;
  box-shadow:0 18px 50px rgba(255,215,0,.08);
  animation:glowCard 3s ease-in-out infinite;
}
@keyframes glowCard{
  0%,100%{box-shadow:0 18px 50px rgba(255,215,0,.06)}
  50%{box-shadow:0 22px 60px rgba(255,215,0,.14)}
}
.my-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  gap:10px;
}
.live{
  font-size:11px;
  font-weight:900;
  color:#7CFFB2;
  letter-spacing:.8px;
  animation:pulseLive 1.6s ease-in-out infinite;
}
@keyframes pulseLive{
  0%,100%{opacity:.65}
  50%{opacity:1}
}
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.actions .btn{flex:1}
.empty{
  text-align:center;
  padding:26px 12px;
  color:var(--muted);
}
.empty-emoji{
  font-size:54px;
  margin-bottom:10px;
  animation:bounce 1.8s ease-in-out infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-12px) rotate(4deg)}
}
.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translateX(-50%) translateY(30px);
  background:rgba(20,10,35,.92);
  border:1px solid rgba(255,255,255,.16);
  color:#fff;
  padding:12px 18px;
  border-radius:18px;
  font-size:13px;
  font-weight:750;
  box-shadow:0 16px 45px rgba(0,0,0,.35);
  opacity:0;
  pointer-events:none;
  transition:all .25s ease;
  z-index:80;
  max-width:90vw;
  text-align:center;
  backdrop-filter:blur(12px);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.loading{
  position:fixed;
  inset:0;
  background:rgba(8,4,16,.72);
  backdrop-filter:blur(8px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  z-index:90;
}
.spinner{
  width:46px;
  height:46px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.12);
  border-top-color:var(--gold);
  border-right-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  font-size:14px;
  font-weight:800;
  color:#fff;
  opacity:.92;
}
.warn{
  background:rgba(231,76,60,.12);
  border:1px solid rgba(231,76,60,.35);
  color:#ffd7d7;
  padding:12px;
  border-radius:16px;
  font-size:12px;
  text-align:center;
}
@media (max-width:380px){
  .hero h1{font-size:27px}
  .create-grid{grid-template-columns:1fr}
  .code-input{letter-spacing:5px;font-size:19px}
}
</style>
</head>
<body>
<div class="orbit" id="orbit"></div>

<main class="wrap">
  <div class="topbar">
    <div class="brand">🎮 СМЕХЛЫСТ</div>
    <div class="userchip">
      <span class="nick" id="userName">—</span>
      <span class="coins" id="userCoins">🪙 0</span>
    </div>
  </div>

  <div id="notLinked" class="warn hidden">
    ⚠️ Открой приложение через кнопку «🎮 ИГРАТЬ» в боте.
  </div>

  <section class="hero">
    <div class="hero-inner">
      <h1>Собери друзей<br>и посмейся</h1>
      <p>Создавай комнаты, заходи по коду, отвечай на вопросы и голосуй за самые смешные ответы.</p>
    </div>
  </section>

  <section id="mySection" class="section hidden"></section>

  <section class="section">
    <h2>➕ Создать комнату</h2>
    <div class="create-grid">
      <button class="btn primary big" id="createText">📝 Текстовый</button>
      <button class="btn purple big" id="createMedia">🖼 Мем-режим</button>
    </div>
  </section>

  <section class="section">
    <h2>🔑 Войти по коду</h2>
    <div class="join-row">
      <input id="codeInput" class="code-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
      <button class="btn gold" id="joinBtn">Войти</button>
    </div>
  </section>

  <section class="section">
    <h2>🌍 Публичные лобби</h2>
    <div id="lobbiesList" class="lobbies"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<div id="loading" class="loading hidden">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Отправляю...</div>
</div>

<script>
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
let linked = false;

if (tg) {
  tg.ready();
  tg.expand();
  linked = !!(tg.initData && tg.initData.length > 0 && tg.initDataUnsafe && tg.initDataUnsafe.user);
}

if (!linked) {
  document.getElementById('notLinked').classList.remove('hidden');
  document.querySelectorAll('button').forEach(b => b.disabled = true);
}

const sp = new URLSearchParams(location.search);

function parseJSON(str, fallback) {
  try {
    return str ? JSON.parse(str) : fallback;
  } catch (e) {
    return fallback;
  }
}

const state = {
  nick: sp.get('nick') || 'Аноним',
  tag: sp.get('tag') || '',
  coins: parseInt(sp.get('coins') || '0', 10) || 0,
  min: parseInt(sp.get('min') || '3', 10) || 3,
  max: parseInt(sp.get('max') || '12', 10) || 12,
  lobbies: parseJSON(sp.get('lobbies'), []),
  my: parseJSON(sp.get('my'), null)
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[m]));
}

function modeLabel(mode) {
  return mode === 'media' ? '🖼 МЕМ' : '📝 ТЕКСТ';
}

function modeBadgeClass(mode) {
  return mode === 'media' ? 'badge mem' : 'badge text';
}

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || 'Отправляю...';
  document.getElementById('loading').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

function haptic(type) {
  try {
    if (tg && tg.HapticFeedback) {
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
      else tg.HapticFeedback.impactOccurred(type || 'light');
    }
  } catch (e) {}
}

function sendAction(type, payload = {}) {
  if (!linked) {
    toast('⚠️ Открой через бота');
    return;
  }

  const labels = {
    game_create: 'Создаю комнату...',
    game_join: 'Вхожу в игру...',
    game_leave: 'Выхожу...',
    game_start: 'Запускаю игру...'
  };

  showLoading(labels[type] || 'Отправляю...');
  haptic('light');

  try {
    tg.sendData(JSON.stringify({ type, ...payload }));
    setTimeout(() => {
      hideLoading();
      haptic('success');
      toast('✅ Отправлено боту');
      setTimeout(() => {
        try { if (tg && tg.close) tg.close(); } catch (e) {}
      }, 700);
    }, 900);
  } catch (e) {
    hideLoading();
    haptic('warning');
    toast('❌ Не удалось отправить');
  }
}

function renderUser() {
  const nameEl = document.getElementById('userName');
  const coinsEl = document.getElementById('userCoins');
  nameEl.textContent = state.nick + (state.tag ? ` [${state.tag}]` : '');
  coinsEl.textContent = `🪙 ${state.coins}`;
}

function renderMy() {
  const sec = document.getElementById('mySection');
  if (!state.my) {
    sec.classList.add('hidden');
    sec.innerHTML = '';
    return;
  }

  const m = state.my;
  sec.classList.remove('hidden');

  const playersHtml = (m.players || []).map(p => `<span class="player-pill">${esc(p)}</span>`).join('') +
    (m.more > 0 ? `<span class="player-pill more">+${m.more}</span>` : '');

  const startBtn = m.can_start
    ? `<button class="btn green" data-start="${esc(m.code)}">▶️ Начать</button>`
    : `<button class="btn ghost" disabled>Нужно ${m.min} игроков</button>`;

  sec.innerHTML = `
    <h2>🟢 Твоя комната</h2>
    <div class="my-card">
      <div class="my-head">
        <span class="live">● В ЛОББИ</span>
        <span class="code">${esc(m.code)}</span>
      </div>
      <div class="meta">
        Хост: <b>${esc(m.host_nick)}</b> · Игроков: <b>${m.count}/${m.max}</b> · Режим: <b>${modeLabel(m.mode)}</b>
      </div>
      <div class="players" style="margin-top:10px">${playersHtml || '<span class="player-pill">Пока один</span>'}</div>
      <div class="actions">
        ${startBtn}
        <button class="btn danger" data-leave="${esc(m.code)}">🚪 Выйти</button>
      </div>
    </div>
  `;
}

function renderLobbies() {
  const list = document.getElementById('lobbiesList');

  if (!state.lobbies || state.lobbies.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-emoji">🎮</div>
        <p>Публичных комнат пока нет.<br>Создай свою — и друзья смогут зайти!</p>
      </div>
    `;
    return;
  }

  list.innerHTML = state.lobbies.map((g, i) => {
    const playersHtml = (g.players || []).map(p => `<span class="player-pill">${esc(p)}</span>`).join('') +
      (g.more > 0 ? `<span class="player-pill more">+${g.more}</span>` : '');

    const joinBtn = g.mine
      ? `<button class="btn ghost" disabled>Ты здесь</button>`
      : `<button class="btn primary" data-join="${esc(g.code)}">Войти</button>`;

    return `
      <div class="lobby" style="animation-delay:${i * 70}ms">
        <div class="lobby-top">
          <span class="code">${esc(g.code)}</span>
          <span class="${modeBadgeClass(g.mode)}">${modeLabel(g.mode)}</span>
        </div>
        <div class="meta">
          Хост: <b>${esc(g.host_nick)}</b> · Игроков: <b>${g.count}/${g.max}</b>
        </div>
        <div class="players">${playersHtml || '<span class="player-pill">Пусто</span>'}</div>
        <div class="lobby-actions">${joinBtn}</div>
      </div>
    `;
  }).join('');
}

function initOrbit() {
  const orbit = document.getElementById('orbit');
  const emojis = ['🎮','😂','🎤','🏆','💬','🎭','🔥','✨','🤣',''];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (18 + Math.random() * 34) + 'px';
    s.style.animationDuration = (10 + Math.random() * 16) + 's';
    s.style.animationDelay = (Math.random() * 12) + 's';
    orbit.appendChild(s);
  }
}

document.getElementById('createText').addEventListener('click', () => {
  sendAction('game_create', { mode: 'text' });
});

document.getElementById('createMedia').addEventListener('click', () => {
  sendAction('game_create', { mode: 'media' });
});

const codeInput = document.getElementById('codeInput');
codeInput.addEventListener('input', () => {
  codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
});

document.getElementById('joinBtn').addEventListener('click', () => {
  const code = codeInput.value.trim().toUpperCase();
  if (code.length !== 4) {
    toast('⚠️ Введи код из 4 символов');
    haptic('warning');
    return;
  }
  sendAction('game_join', { code });
});

document.getElementById('lobbiesList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-join]');
  if (!btn || btn.disabled) return;
  sendAction('game_join', { code: btn.dataset.join });
});

document.getElementById('mySection').addEventListener('click', (e) => {
  const leave = e.target.closest('[data-leave]');
  if (leave) {
    sendAction('game_leave', { code: leave.dataset.leave });
    return;
  }

  const start = e.target.closest('[data-start]');
  if (start) {
    sendAction('game_start', { code: start.dataset.start });
  }
});

renderUser();
renderMy();
renderLobbies();
initOrbit();
</script>
</body>
</html>
