<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>МЕМТОП Кейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;min-height:100vh;
 user-select:none;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:20px 0;
 background:linear-gradient(120deg,#1a0b2e,#2d1b4e,#12081f,#2d1b4e,#1a0b2e);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1{font-size:22px;font-weight:800;color:#ffd700;text-shadow:0 2px 14px rgba(255,215,0,.45)}
.sub{font-size:12px;color:#b8a5d9;margin:4px 0 10px}
.linkwarn{display:none;width:92%;max-width:420px;background:#5a1a1a;border:1px solid #e74c3c;border-radius:12px;
 padding:10px;font-size:12px;color:#ffd7d7;margin-bottom:10px;text-align:center}
.coins{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.35);border-radius:20px;padding:7px 20px;font-weight:700;margin-bottom:14px}
.coins span{color:#ffd700}
.tags-btn{background:linear-gradient(135deg,#4b69ff,#8847ff);border:2px solid #b47aff;color:#fff;font-size:14px;font-weight:700;padding:10px 24px;border-radius:22px;cursor:pointer;margin-bottom:14px;box-shadow:0 4px 14px rgba(75,105,255,.4)}
.tags-btn:active{transform:scale(.95)}
.case{font-size:56px;margin-bottom:10px;filter:drop-shadow(0 6px 20px rgba(255,215,0,.5));animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.case.shaking{animation:sh .6s ease}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.reel-box{position:relative;width:100%;max-width:420px;height:150px;overflow:hidden;background:rgba(0,0,0,.45);border-radius:14px;margin-bottom:16px;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.marker{position:absolute;top:0;left:50%;width:3px;height:100%;background:#ffd700;transform:translateX(-50%);z-index:5;box-shadow:0 0 14px rgba(255,215,0,.9)}
.strip{display:flex;align-items:center;height:100%;will-change:transform}
.card{flex:0 0 110px;height:120px;margin:0 5px;border-radius:12px;background:#1e1433;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid var(--rar);position:relative;overflow:hidden}
.card .em{font-size:38px}
.card .nm{font-size:11px;font-weight:700;text-align:center;padding:0 4px}
.card .rar{position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--rar)}
.open-btn{background:linear-gradient(135deg,#8b3dff,#6a1bb8,#8b3dff);background-size:200% 200%;border:2px solid #b47aff;color:#fff;font-size:17px;font-weight:800;padding:14px 52px;border-radius:28px;cursor:pointer;box-shadow:0 8px 26px rgba(138,43,226,.5);animation:bg 3s ease infinite}
.open-btn:active{transform:scale(.94)}
.open-btn:disabled{opacity:.5;cursor:not-allowed}
.legend{margin-top:16px;width:100%;max-width:420px;background:rgba(255,255,255,.06);border-radius:16px;padding:12px 14px}
.legend-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:12px;line-height:1.4}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:2px}
.legend-item .lg-pct{color:#ffd700;font-weight:800}
.legend-item .lg-tags{color:#b8a5d9;font-size:11px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
.overlay.show{display:flex}
.result-box{background:linear-gradient(135deg,#2d1b4e,#12081f);border:2px solid #ffd700;border-radius:24px;padding:26px 24px;text-align:center;max-width:320px;width:100%}
.result-emoji{font-size:60px;margin-bottom:10px}
.result-title{font-size:20px;font-weight:800;margin-bottom:6px}
.result-rar{font-size:13px;font-weight:700;margin-bottom:6px;min-height:16px}
.result-text{font-size:12px;color:#b8a5d9;line-height:1.5;margin-bottom:12px}
.result-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.claim-btn{flex:1 1 100%;background:#ffd700;color:#12081f;border:none;padding:12px 30px;border-radius:20px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.claim-btn:active{transform:scale(.95)}
.again-btn,.back-btn{flex:1 1 auto;background:transparent;color:#b8a5d9;border:1px solid #b8a5d9;padding:10px 18px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;min-width:110px}
.again-btn:active,.back-btn:active{transform:scale(.95);background:rgba(184,165,217,.1)}
.coin-form{margin-top:10px}
.coin-form input{display:block;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:10px;font-family:inherit}
.coin-form input:focus{outline:none;border-color:#ffd700;background:rgba(255,255,255,.15)}
.coin-form input::placeholder{color:#8a7aa8}
.coin-form-error{color:#ff6b6b;font-size:12px;margin-bottom:8px;min-height:14px}
.coin-submit-btn{display:block;width:100%;background:#ffd700;color:#12081f;border:none;padding:12px;border-radius:20px;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:8px}
.coin-submit-btn:disabled{opacity:.5;cursor:not-allowed}
.coin-reserve-btn{display:block;width:100%;background:transparent;color:#b8a5d9;border:1px solid #b8a5d9;padding:10px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;text-align:center}
.tags-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);display:none;flex-direction:column;z-index:60;padding:20px;overflow-y:auto}
.tags-modal.show{display:flex}
.tags-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.tags-modal-title{font-size:20px;font-weight:800;color:#ffd700}
.tags-modal-close{background:transparent;border:none;color:#fff;font-size:26px;cursor:pointer;padding:0 8px}
.tags-counter{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;margin-bottom:12px;text-align:center}
.tags-counter b{color:#ffd700}
.tags-active{background:rgba(255,215,0,.15);border:1px solid #ffd700;border-radius:14px;padding:12px;margin-bottom:16px;text-align:center}
.tags-active-label{font-size:11px;color:#ffd700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.tags-active-name{font-size:18px;font-weight:800}
.tags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-width:500px;margin:0 auto;width:100%}
.tag-item{background:rgba(255,255,255,.06);border:2px solid var(--rar,#555);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.tag-item:active{transform:scale(.96)}
.tag-item.is-active{border-color:#ffd700;box-shadow:0 0 18px rgba(255,215,0,.6);background:rgba(255,215,0,.1)}
.tag-item.is-active::after{content:"✓ АКТИВНЫЙ";position:absolute;top:-8px;right:-6px;background:#ffd700;color:#12081f;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px}
.tag-item.locked{cursor:default;filter:grayscale(1);opacity:.45}
.tag-item.locked:active{transform:none}
.tag-item .em{font-size:32px;margin-bottom:4px}
.tag-item .nm{font-size:12px;font-weight:700;margin-bottom:2px}
.tag-item .rar-label{font-size:10px;color:var(--rar,#999);font-weight:600}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,20px)}20%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
</style>
</head>
<body>
<h1>🎰 МЕМТОП КЕЙС</h1>
<div class="sub">Открытие как в CS2 · v23</div>
<div class="linkwarn" id="linkWarn">⚠️ Рулетка открыта НЕ из бота! Закрой это окно и открой рулетку кнопкой 🎰 РУЛЕТКА внутри бота.</div>
<div class="coins">🪙 Топикоинов: <span id="coins">0</span></div>
<button class="tags-btn" id="tagsBtn">🏷 МОИ ТЕГИ (<span id="tagsCount">0/11</span>)</button>
<div class="case" id="case">🧰</div>
<div class="reel-box"><div class="marker"></div><div class="strip" id="strip"></div></div>
<button class="open-btn" id="openBtn">ОТКРЫТЬ КЕЙС</button>
<div class="legend" id="legend"></div>

<div class="overlay" id="overlay">
  <div class="result-box">
    <div class="result-emoji" id="rEmoji">🎉</div>
    <div class="result-title" id="rTitle"></div>
    <div class="result-rar" id="rRar"></div>
    <div class="result-text" id="rText"></div>
    <div class="result-actions">
      <a class="claim-btn" id="claimBtn" href="#">🎁 ЗАБРАТЬ ПРИЗ</a>
      <button class="again-btn" id="againBtn">🔄 Крутить ещё</button>
      <button class="back-btn" id="backBtn">← Назад</button>
    </div>
  </div>
</div>

<div class="tags-modal" id="tagsModal">
  <div class="tags-modal-header">
    <div class="tags-modal-title">🏷 МОИ ТЕГИ</div>
    <button class="tags-modal-close" id="tagsModalClose">×</button>
  </div>
  <div class="tags-counter" id="tagsCounter">Получено: <b>0</b> из 11</div>
  <div class="tags-active" id="tagsActive">
    <div class="tags-active-label">Активный тег</div>
    <div class="tags-active-name" id="tagsActiveName">—</div>
  </div>
  <div class="tags-grid" id="tagsGrid"></div>
</div>

<script>
const tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
let linked=false;
if(tg){tg.ready();tg.expand();linked=!!(tg.initData&&tg.initData.length>0&&tg.initDataUnsafe&&tg.initDataUnsafe.user);}
if(!linked){document.getElementById('linkWarn').style.display='block';document.getElementById('openBtn').disabled=true;}

const BOT_USERNAME="BetaMemTop26_bot";
const SECRET="memtop_roulette_secret_2024";

async function hmacSign(payload){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('HMAC',key,enc.encode(payload));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,10);
}
function randNonce(){return Math.random().toString(36).slice(2,10);}

// === localStorage-синхронизация ===
const LS_TAGS='memtop_tags_v1';
const LS_ACTIVE='memtop_active_v1';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const sp=new URLSearchParams(location.search);
let userCoins=parseInt(sp.get('c')||'0',10)||0;
let userTags=(sp.get('tags')||'').split(',').filter(x=>x.length>0);
let userActive=decodeURIComponent(sp.get('active')||'');
const lsTags=lsGet(LS_TAGS,[]);
lsTags.forEach(t=>{if(!userTags.includes(t))userTags.push(t);});
lsSet(LS_TAGS,userTags);
const lsActive=lsGet(LS_ACTIVE,'');
if(!userActive && lsActive) userActive=lsActive;
if(userActive && !lsActive) lsSet(LS_ACTIVE,userActive);
document.getElementById('coins').textContent=userCoins;

// ═══════════ КАТЕГОРИИ И ШАНСЫ (сумма = 100%) ═══════════
const ITEM_META={
 coin:{em:'🪙',nm:'10 Топикоинов'},
 nothing:{em:'💨',nm:'Пусто'},
 tag_vip:{em:'💎',nm:'VIP'},
 tag_pepe:{em:'🐸',nm:'Пепе'},
 tag_joker:{em:'🃏',nm:'Джокер'},
 tag_dino:{em:'🦖',nm:'Дино'},
 tag_obereg:{em:'🧿',nm:'Оберег'},
 tag_lucky:{em:'🍀',nm:'Счастливчик'},
 tag_syrok:{em:'🧀',nm:'Сырок'},
 tag_medved:{em:'🐻',nm:'Медведь'},
 tag_temny:{em:'🌚',nm:'Тёмный'},
 tag_turbo:{em:'🐢',nm:'Турбо'},
 tag_pchela:{em:'🐝',nm:'Пчела'},
};
const CAT_DEF={
 coin:     {pct:5,  label:'🪙 Топикоины',  c:'#ffd700', keys:['coin']},
 legendary:{pct:5,  label:'🔴 Легендарный', c:'#eb4b4b', keys:['tag_vip']},
 epic:     {pct:20, label:'🟣 Эпический',   c:'#8847ff', keys:['tag_pepe','tag_joker','tag_dino','tag_obereg']},
 rare:     {pct:50, label:'🔵 Редкий',      c:'#4b69ff', keys:['tag_lucky','tag_syrok','tag_medved','tag_temny','tag_turbo','tag_pchela']},
 nothing:  {pct:20, label:'💨 Пусто',       c:'#555555', keys:['nothing']},
};
const ORDER=['coin','legendary','epic','rare','nothing'];
function catOf(t){for(const k of ORDER){if(CAT_DEF[k].keys.includes(t))return k;}return 'nothing';}
function itemObj(t){const m=ITEM_META[t];return {t,em:m.em,nm:m.nm,c:CAT_DEF[catOf(t)].c,label:CAT_DEF[catOf(t)].label};}

// TAG_INFO только для тегов (для списка «МОИ ТЕГИ»)
const TAG_INFO={};
ORDER.forEach(k=>{ if(k==='coin'||k==='nothing')return; CAT_DEF[k].keys.forEach(t=>{ TAG_INFO[t]={em:ITEM_META[t].em,nm:ITEM_META[t].nm,label:CAT_DEF[k].label,c:CAT_DEF[k].c}; }); });
const TOTAL_TAGS=Object.keys(TAG_INFO).length;
document.getElementById('tagsCount').textContent=userTags.length+'/'+TOTAL_TAGS;

// Ровный выбор предмета по процентам категории
function pickByCat(){
  const r=Math.random()*100; let a=0;
  for(const k of ORDER){ a+=CAT_DEF[k].pct; if(r<a){const arr=CAT_DEF[k].keys;return itemObj(arr[Math.floor(Math.random()*arr.length)]);} }
  return itemObj('nothing');
}
const roll=pickByCat;       // выигрышный предмет
const fillItem=pickByCat;   // случайная карточка в ленте

function makeCard(it){const c=document.createElement('div');c.className='card';c.style.setProperty('--rar',it.c);
 c.innerHTML='<div class="em">'+it.em+'</div><div class="nm">'+it.nm+'</div><div class="rar"></div>';return c;}

const strip=document.getElementById('strip'),openBtn=document.getElementById('openBtn'),
 overlay=document.getElementById('overlay'),caseEl=document.getElementById('case'),
 claimBtn=document.getElementById('claimBtn'),againBtn=document.getElementById('againBtn'),
 backBtn=document.getElementById('backBtn'),
 tagsBtn=document.getElementById('tagsBtn'),tagsModal=document.getElementById('tagsModal'),
 tagsModalClose=document.getElementById('tagsModalClose'),tagsGrid=document.getElementById('tagsGrid'),
 tagsActiveName=document.getElementById('tagsActiveName'),tagsCount=document.getElementById('tagsCount'),
 tagsCounter=document.getElementById('tagsCounter');

const CARD_W=120,REEL_LEN=60,WIN_INDEX=50;
let spinning=false;
for(let i=0;i<REEL_LEN;i++)strip.appendChild(makeCard(fillItem()));

// Легенда по категориям
const legend=document.getElementById('legend');
ORDER.forEach(k=>{const d=CAT_DEF[k];
 const ems=d.keys.map(t=>ITEM_META[t].em).join(' ');
 const row=document.createElement('div');row.className='legend-item';
 row.innerHTML='<div class="dot" style="background:'+d.c+'"></div><div><span class="lg-pct">'+d.pct+'%</span> — '+d.label+'<div class="lg-tags">'+ems+'</div></div>';
 legend.appendChild(row);});

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){
    const freshTags=lsGet(LS_TAGS,[]);
    freshTags.forEach(t=>{if(!userTags.includes(t))userTags.push(t);});
    const freshActive=lsGet(LS_ACTIVE,'');
    if(freshActive) userActive=freshActive;
    tagsCount.textContent=userTags.length+'/'+TOTAL_TAGS;
  }
});

tagsBtn.addEventListener('click',openTagsModal);
tagsModalClose.addEventListener('click',()=>tagsModal.classList.remove('show'));
backBtn.addEventListener('click',()=>{overlay.classList.remove('show');});

function openTelegram(url){ if(tg&&tg.openTelegramLink){tg.openTelegramLink(url);} else{window.location.href=url;} }
function openTagsModal(){ renderTagsGrid(); tagsModal.classList.add('show'); }

function renderTagsGrid(){
  const freshTags=lsGet(LS_TAGS,[]);
  freshTags.forEach(t=>{if(!userTags.includes(t))userTags.push(t);});
  const freshActive=lsGet(LS_ACTIVE,'');
  if(freshActive) userActive=freshActive;
  tagsGrid.innerHTML='';
  tagsActiveName.textContent=userActive||'— нет активного тега —';
  const got=userTags.length;
  tagsCounter.innerHTML='Получено: <b>'+got+'</b> из '+TOTAL_TAGS+'  ·  Не получено: <b>'+(TOTAL_TAGS-got)+'</b>';
  tagsCount.textContent=got+'/'+TOTAL_TAGS;
  Object.entries(TAG_INFO).forEach(([tagType,info])=>{
    const owned=userTags.includes(tagType);
    const item=document.createElement('div');
    item.className='tag-item'+(owned?'':' locked')+(userActive===info.nm?' is-active':'');
    item.style.setProperty('--rar', owned?info.c:'#444');
    item.innerHTML='<div class="em">'+(owned?info.em:'🔒')+'</div>'+
      '<div class="nm">'+info.nm+'</div>'+
      '<div class="rar-label">'+(owned?info.label:'не получено')+'</div>';
    if(owned){item.addEventListener('click',()=>selectTag(tagType,info.nm));}
    tagsGrid.appendChild(item);
  });
}

async function selectTag(tagType,tagText){
  if(userActive===tagText){ if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('warning'); return; }
  let url='';
  try{ const n=randNonce(); const s=await hmacSign(tagType+"_"+n); url="https://t.me/"+BOT_USERNAME+"?start=claim_"+tagType+"_"+n+"_"+s; }catch(e){}
  userActive=tagText; lsSet(LS_ACTIVE,tagText);
  renderTagsGrid(); tagsModal.classList.remove('show');
  showQuickToast('✅ '+tagText+' активирован!');
  if(url){ setTimeout(()=>{ if(tg&&tg.close)tg.close(); openTelegram(url); },500); }
  else { showQuickToast('⚠️ Обнови Telegram и повтори'); }
}

function showQuickToast(text){
  const toast=document.createElement('div');toast.textContent=text;
  toast.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#ffd700;color:#12081f;padding:10px 20px;border-radius:20px;font-weight:700;z-index:100;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:fadeInOut 2s ease';
  document.body.appendChild(toast);setTimeout(()=>toast.remove(),2000);
}

openBtn.addEventListener('click',()=>{
 if(spinning||!linked)return;spinning=true;openBtn.disabled=true;overlay.classList.remove('show');
 if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('medium');
 caseEl.classList.add('shaking');setTimeout(()=>caseEl.classList.remove('shaking'),650);
 const winner=roll();
 strip.style.transition='none';strip.style.transform='translateX(0)';strip.innerHTML='';
 for(let i=0;i<REEL_LEN;i++)strip.appendChild(makeCard(i===WIN_INDEX?winner:fillItem()));
 void strip.offsetWidth;
 const boxW=document.querySelector('.reel-box').offsetWidth;
 const jitter=(Math.random()*2-1)*(CARD_W/2-14);
 const target=WIN_INDEX*CARD_W+CARD_W/2-boxW/2+jitter;
 strip.style.transition='transform 6.5s cubic-bezier(.15,.85,.25,1)';
 strip.style.transform='translateX('+(-target)+'px)';
 setTimeout(()=>{
   strip.style.transition='transform .35s cubic-bezier(.3,1.4,.5,1)';
   strip.style.transform='translateX('+(-target-10)+'px)';
   setTimeout(()=>{strip.style.transition='transform .3s cubic-bezier(.3,1.4,.5,1)';strip.style.transform='translateX('+(-target)+'px)';},350);
   showResult(winner);
   spinning=false;openBtn.disabled=false;
 },6500);
});

async function showResult(it){
 document.getElementById('rEmoji').textContent=it.em;
 document.getElementById('rTitle').textContent=it.nm;
 const r=document.getElementById('rRar');
 r.textContent=(it.t==='nothing')?'':it.label;
 r.style.color=it.c;
 const oldForm=document.getElementById('coinForm'); if(oldForm) oldForm.remove();

 if(it.t==='nothing'){
   document.getElementById('rText').textContent='Ничего не выпало. Попробуй ещё раз!';
   claimBtn.style.display='none'; againBtn.style.display='block'; backBtn.style.display='block';
   if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('warning');
 } else if(it.t==='coin'){
   document.getElementById('rText').innerHTML='🎉 <b style="color:#ffd700">Поздравляю!</b><br>Введите свои данные для вручения приза';
   claimBtn.style.display='none'; againBtn.style.display='none'; backBtn.style.display='none';
   const form=document.createElement('div');form.className='coin-form';form.id='coinForm';
   form.innerHTML='<div class="coin-form-error" id="coinFormError"></div>'+
     '<input type="text" id="fioInput" placeholder="ФИО (например: Иванов Иван Иванович)" maxlength="100">'+
     '<input type="text" id="groupInput" placeholder="Группа (например: ИС-21-1)" maxlength="50">'+
     '<button class="coin-submit-btn" id="coinSubmitBtn">📨 Отправить владельцу</button>'+
     '<a class="coin-reserve-btn" id="coinReserveBtn" href="#" target="_blank">⚠️ Если не получилось — написать вручную</a>';
   document.querySelector('.result-box').appendChild(form);
   let nonce='',sig='';
   try{ nonce=randNonce(); sig=await hmacSign(it.t+"_"+nonce); }catch(e){}
   document.getElementById('coinSubmitBtn').addEventListener('click',async ()=>{
     const fio=document.getElementById('fioInput').value.trim();
     const group=document.getElementById('groupInput').value.trim();
     const errEl=document.getElementById('coinFormError');
     if(!fio){errEl.textContent='⚠️ Введите ФИО';return;}
     if(!group){errEl.textContent='⚠️ Введите группу';return;}
     if(fio.length<3){errEl.textContent='⚠️ Слишком короткое ФИО';return;}
     errEl.textContent='';
     document.getElementById('coinSubmitBtn').disabled=true;
     document.getElementById('coinSubmitBtn').textContent='⏳ Отправка...';
     try{
       if(tg&&tg.sendData&&nonce&&sig){
         tg.sendData(JSON.stringify({type:'coin',fio:fio,group:group,nonce:nonce,sig:sig}));
         showQuickToast('✅ Данные отправлены!');
         setTimeout(()=>{if(tg&&tg.close)tg.close();},1500);
       } else {
         errEl.textContent='⚠️ Telegram недоступен. Используйте резервную кнопку ниже.';
         document.getElementById('coinSubmitBtn').disabled=false;
         document.getElementById('coinSubmitBtn').textContent='📨 Отправить владельцу';
       }
     }catch(e){
       errEl.textContent='⚠️ Ошибка отправки. Используйте резервную кнопку.';
       document.getElementById('coinSubmitBtn').disabled=false;
       document.getElementById('coinSubmitBtn').textContent='📨 Отправить владельцу';
     }
     const reserveMsg='🎰 Я выбил ТОПИКОИНЫ в МЕМТОП!\n\n👤 ФИО: '+fio+'\n🎓 Группа: '+group+'\n🪙 Награда: 10 монет\n\nПрошу выдать приз!';
     document.getElementById('coinReserveBtn').href='https://t.me/share/url?url=&text='+encodeURIComponent(reserveMsg);
   });
   const reserveMsg0='🎰 Я выбил ТОПИКОИНЫ в МЕМТОП!\n\n👤 ФИО: (укажи)\n🎓 Группа: (укажи)\n🪙 Награда: 10 монет\n\nПрошу выдать приз!';
   document.getElementById('coinReserveBtn').href='https://t.me/share/url?url=&text='+encodeURIComponent(reserveMsg0);
   if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
 } else {
   // ===== ТЕГ: СИНХРОННО В КОЛЛЕКЦИЮ СРАЗУ (главный фикс) =====
   const info=TAG_INFO[it.t];
   if(!userTags.includes(it.t)){ userTags.push(it.t); lsSet(LS_TAGS,userTags); }   // ← ДО await
   tagsCount.textContent=userTags.length+'/'+TOTAL_TAGS;

   let wearUrl='',autoOk=false;
   try{
     const nA=randNonce(),sA=await hmacSign(it.t+"_"+nA);
     try{ if(tg&&tg.sendData){ tg.sendData(JSON.stringify({type:it.t,nonce:nA,sig:sA})); autoOk=true; } }catch(e){}
     const nW=randNonce(),sW=await hmacSign(it.t+"_"+nW);
     wearUrl="https://t.me/"+BOT_USERNAME+"?start=claim_"+it.t+"_"+nW+"_"+sW;
   }catch(e){}

   document.getElementById('rText').textContent='🎉 Тег выбит и добавлен в коллекцию! Нажми «Надеть», чтобы показать его рядом с именем.';
   claimBtn.style.display='block'; claimBtn.textContent='🎽 Надеть';
   againBtn.style.display='block'; backBtn.style.display='block';
   if(wearUrl) claimBtn.href=wearUrl;
   claimBtn.onclick=(e)=>{
     e.preventDefault();
     userActive=info.nm; lsSet(LS_ACTIVE,info.nm);
     showQuickToast('✅ Тег '+info.nm+' надет!');
     overlay.classList.remove('show');
     if(wearUrl){ setTimeout(()=>{ if(tg&&tg.close)tg.close(); openTelegram(wearUrl); },600); }
     else { showQuickToast('⚠️ Обнови Telegram и нажми «Надеть» ещё раз'); }
   };
   if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
 }
 overlay.classList.add('show');
}
againBtn.addEventListener('click',()=>{overlay.classList.remove('show');openBtn.click();});
</script>
</body>
</html>
